<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تولدت مبارک 🎂💙</title>

    <style>
            * {
              box-sizing: border-box;
            }

            body {
              margin: 0;
              min-height: 100vh;
              overflow-x: hidden;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #ffffff;
              font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
              background:
                radial-gradient(circle at 50% 15%, #154374 0%, transparent 55%),
                radial-gradient(circle at 85% 85%, #0d2847 0%, transparent 45%),
                linear-gradient(135deg, #030a16, #071933, #020813);
            }

            .container {
              width: min(94%, 650px);
              padding: 30px 15px;
              text-align: center;
            }

            h1 {
              margin: 0 0 15px;
              color: #80d8ff;
              font-size: clamp(1.8rem, 7vw, 3rem);
              text-shadow:
                0 0 20px rgba(0, 229, 255, 0.6),
                0 0 40px rgba(0, 140, 255, 0.3);
              animation: fadeIn 1.2s ease;
            }

            .subtitle {
              margin: 0;
              color: #b0bec5;
              line-height: 2;
              font-size: 1.05rem;
            }

            /* محدودهٔ کیک */
            .cake-area {
              position: relative;
              width: 360px;
              height: 300px;
              margin: 48px auto 18px;
            }

            /* سایهٔ زیر کیک */
            .cake-shadow {
              position: absolute;
              left: 35px;
              bottom: 15px;
              width: 290px;
              height: 26px;
              border-radius: 50%;
              background: rgba(0, 0, 0, 0.65);
              filter: blur(8px);
            }

            /* بشقاب کریستالی / نئونی زیر کیک */
            .cake-plate {
              position: absolute;
              bottom: 12px;
              left: 8px;
              width: 344px;
              height: 30px;
              border-radius: 50%;
              background: linear-gradient(180deg, #ffffff 0%, #cfd8dc 50%, #90a4ae 100%);
              box-shadow:
                0 6px 0 #546e7a,
                0 12px 25px rgba(0, 229, 255, 0.25);
              z-index: 1;
            }

            /* بدنهٔ کلی کیک */
            .cake {
              position: absolute;
              left: 25px;
              bottom: 32px;
              width: 310px;
              height: 220px;
              z-index: 2;
            }

            /* قسمت بالایی خامه کیک */
            .cake-top {
              position: absolute;
              top: 0;
              left: 0;
              width: 310px;
              height: 92px;
              border-radius: 50%;
              background: radial-gradient(
                ellipse at 50% 35%,
                #ffffff 0%,
                #fdfbf7 50%,
                #f1e4d3 100%
              );
              box-shadow:
                inset 0 -10px 0 rgba(210, 180, 140, 0.35),
                0 8px 0 #d7c4b0,
                0 13px 20px rgba(0, 0, 0, 0.35);
              z-index: 4;
            }

            /* لایهٔ میانی - شکلات غنی با بافت */
            .cake-middle {
              position: absolute;
              top: 58px;
              left: 0;
              width: 310px;
              height: 105px;
              overflow: hidden;
              border-radius: 15px 15px 25px 25px;
              background:
                linear-gradient(
                  90deg,
                  rgba(255, 255, 255, 0.12),
                  transparent 25%,
                  rgba(255, 255, 255, 0.08) 50%,
                  transparent 75%
                ),
                linear-gradient(180deg, #4e2612, #381a0b);
              box-shadow:
                inset 0 10px rgba(255, 255, 255, 0.1),
                inset 0 -12px rgba(20, 9, 3, 0.5);
              z-index: 2;
            }

            /* لایهٔ پایینی کیک */
            .cake-bottom {
              position: absolute;
              left: 0;
              bottom: 0;
              width: 310px;
              height: 75px;
              border-radius: 0 0 22px 22px;
              background:
                linear-gradient(
                  90deg,
                  rgba(255, 255, 255, 0.1),
                  transparent 30%,
                  rgba(255, 255, 255, 0.08) 65%,
                  transparent
                ),
                linear-gradient(180deg, #3d1b0b, #261005);
              box-shadow:
                inset 0 -11px rgba(0, 0, 0, 0.4),
                0 8px 0 #180a03;
              z-index: 1;
            }

            /* خامهٔ روی لبه */
            .cream {
              position: absolute;
              top: 49px;
              left: 0;
              width: 310px;
              height: 45px;
              z-index: 5;
              background: #fffcf7;
              box-shadow: 0 4px 0 rgba(215, 196, 176, 0.5);
            }

            .cream-front {
              border-radius: 0 0 25px 25px;
            }

            /* قطره‌های خامه جاری‌شده */
            .cream-front span {
              position: absolute;
              top: 20px;
              width: 31px;
              height: 37px;
              border-radius: 0 0 18px 18px;
              background: #fffcf7;
            }

            .cream-front span:nth-child(1) { left: 28px; height: 32px; }
            .cream-front span:nth-child(2) { left: 87px; height: 48px; }
            .cream-front span:nth-child(3) { left: 145px; height: 34px; }
            .cream-front span:nth-child(4) { left: 205px; height: 46px; }
            .cream-front span:nth-child(5) { left: 260px; height: 30px; }

            /* توت‌های قرمز یاقوتی */
            .berry {
              position: absolute;
              width: 18px;
              height: 18px;
              border-radius: 50%;
              background: radial-gradient(circle at 35% 30%, #ff6b6b, #c0192e 65%, #660512 100%);
              box-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
            }

            .berry-1 { top: 25px; left: 50px; }
            .berry-2 { top: 42px; left: 145px; }
            .berry-3 { top: 23px; right: 48px; }

            /* ترافل‌های رنگی */
            .sprinkle {
              position: absolute;
              width: 23px;
              height: 5px;
              border-radius: 5px;
              transform: rotate(-25deg);
            }

            .sprinkle-1 { top: 72px; left: 45px; background: #00e5ff; }
            .sprinkle-2 { top: 83px; left: 105px; background: #ffd166; transform: rotate(25deg); }
            .sprinkle-3 { top: 72px; left: 180px; background: #ff4081; }
            .sprinkle-4 { top: 86px; right: 42px; background: #00e676; transform: rotate(20deg); }
            .sprinkle-5 { top: 60px; right: 95px; background: #ff9100; transform: rotate(-35deg); }

            /* شمع‌ها */
            .candles {
              position: absolute;
              top: -59px;
              left: 35px;
              z-index: 7;
              display: flex;
              align-items: flex-end;
              justify-content: space-between;
              width: 240px;
            }

            .candle {
              position: relative;
              width: 20px;
              border-radius: 6px 6px 3px 3px;
              box-shadow:
                inset 2px 0 rgba(255, 255, 255, 0.5),
                0 4px 10px rgba(0, 0, 0, 0.35);
            }

            .candle-1 { height: 65px; background: repeating-linear-gradient(-45deg, #00d2d3 0 10px, #ffffff 10px 20px); }
            .candle-2 { height: 78px; background: repeating-linear-gradient(-45deg, #29b6f6 0 10px, #ffffff 10px 20px); }
            .candle-3 { height: 72px; background: repeating-linear-gradient(-45deg, #00e5ff 0 10px, #ffffff 10px 20px); }
            .candle-4 { height: 62px; background: repeating-linear-gradient(-45deg, #40c4ff 0 10px, #ffffff 10px 20px); }

            /* فتیلهٔ شمع */
            .candle::before {
              content: "";
              position: absolute;
              top: -7px;
              left: 8.5px;
              width: 3px;
              height: 9px;
              border-radius: 3px;
              background: #212121;
            }

            /* شعله شمع */
            .flame {
              position: absolute;
              top: -39px;
              left: -3px;
              width: 26px;
              height: 37px;
              border-radius: 50% 50% 50% 0;
              background: linear-gradient(135deg, #ffe082 0%, #ff9800 100%);
              transform: rotate(-45deg);
              transform-origin: 50% 80%;
              box-shadow:
                0 0 12px #ff9800,
                0 0 25px #ff6d00,
                0 0 45px rgba(255, 171, 0, 0.6);
              animation: flicker 0.25s infinite alternate;
            }

            .flame::after {
              content: "";
              position: absolute;
              top: 8px;
              left: 8px;
              width: 10px;
              height: 16px;
              border-radius: 50% 50% 50% 0;
              background: #fffde7;
            }

            @keyframes flicker {
              0% { transform: rotate(-45deg) scale(1); }
              50% { transform: rotate(-39deg) scale(0.92); }
              100% { transform: rotate(-51deg) scale(1.08); }
            }

            /* دکمه‌ها */
            button {
              border: none;
              border-radius: 999px;
              padding: 14px 34px;
              margin: 10px 6px;
              cursor: pointer;
              color: #031830;
              background: linear-gradient(135deg, #00e5ff, #00b0ff);
              font-size: 1rem;
              font-family: inherit;
              font-weight: bold;
              box-shadow:
                0 4px 0 #0088a3,
                0 8px 20px rgba(0, 229, 255, 0.35);
              transition: 0.2s;
            }

            button:hover {
              transform: translateY(-2px);
              box-shadow:
                0 6px 0 #0088a3,
                0 10px 25px rgba(0, 229, 255, 0.5);
            }

            button:active {
              transform: translateY(2px);
              box-shadow: 0 2px 0 #0088a3;
            }

            button:disabled {
              cursor: wait;
              opacity: 0.7;
            }

            #manualButton {
              display: none;
              color: white;
              background: linear-gradient(135deg, #1e88e5, #1565c0);
              box-shadow:
                0 4px 0 #0d47a1,
                0 8px 20px rgba(21, 101, 192, 0.4);
            }

            #status {
              min-height: 32px;
              margin: 18px auto;
              color: #90caf9;
              font-weight: 500;
              line-height: 2;
            }

            /* باکس پیام نهایی */
            #message {
              display: none;
              margin: 30px auto 10px;
              padding: 25px;
              border: 1px solid rgba(0, 229, 255, 0.35);
              border-radius: 24px;
              background: rgba(8, 23, 44, 0.85);
              backdrop-filter: blur(12px);
              box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(0, 229, 255, 0.2);
              animation: messageIn 0.9s ease;
            }

            #message h2 {
              margin-top: 0;
              color: #80d8ff;
              font-size: 1.8rem;
              text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            }

            #typedMessage {
              min-height: 120px;
              white-space: normal;
              line-height: 2.2;
              font-size: 1.08rem;
              color: #f0f8ff;
            }

            .signature {
              color: #80d8ff;
              font-weight: bold;
            }

            /* کنفتی */
            .confetti {
              position: fixed;
              top: -25px;
              width: 9px;
              height: 17px;
              z-index: 100;
              pointer-events: none;
              animation: fall linear forwards;
            }

            @keyframes fall {
              to {
                top: 110vh;
                transform: translateX(var(--move-x)) rotate(900deg);
              }
            }

            /* ستاره‌ها و جرقه‌ها */
            .sparkle {
              position: fixed;
              z-index: 90;
              pointer-events: none;
              font-size: 24px;
              animation: sparkle-animation 1.5s ease-out forwards;
            }

            @keyframes sparkle-animation {
              from {
                opacity: 1;
                transform: scale(0.5) rotate(0deg);
              }
              to {
                opacity: 0;
                transform: scale(1.8) rotate(180deg) translateY(-100px);
              }
            }

            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(20px); }
              to { opacity: 1; transform: translateY( scale(0.85) translateY(20px); }
              to { opacity: 1; transform: scale(1) translateY(0); }
            }

            @media (max-width: 430px) {
              .cake-area {
                transform: scale(0.86);
      30px) {
              .cake-area {
                transform: scale(0.86);
                transform-origin: center;
                margin-top: 25px;
                margin-bottom: 0;
              }
              .container {
                padding-top: 20px;
              }
            }
    </style>
  </head>

  <body>
    <main class="container">
      <h1>تولدت مبارک جوجه چاقوکش 🐥🔪</h1>
      <p class="subtitle">
        اول روی دکمه بزن، بعد برای خاموش‌کردن شمع‌ها به میکروفون فوت کن 💨
      </p>

      <div class="cake-area">
        <div class="cake-shadow"></div>
        <div class="cake-plate"></div>

        <div class="cake">
          <div class="cake-top"></div>

          <div class="cream cream-front">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="cake-middle">
            <div class="berry berry-1"></div>
            <div class="berry berry-2"></div>
            <div class="berry berry-3"></div>

            <div class="sprinkle sprinkle-1"></div>
            <div class="sprinkle sprinkle-2"></div>
            <div class="sprinkle sprinkle-3"></div>
            <div class="sprinkle sprinkle-4"></div>
            <div class="sprinkle sprinkle-5"></div>
          </div>

          <div class="cake-bottom"></div>

          <div class="candles">
            <div class="candle candle-1">
              <div class="flame"></div>
            </div>

            <div class="candle candle-2">
              <div class="flame"></div>
            </div>

            <div class="candle candle-3">
              <div class="flame"></div>
            </div>

            <div class="candle candle-4">
              <div class="flame"></div>
            </div>
          </div>
        </div>
      </div>

      <button id="startButton">روشن‌کردن شمع‌ها 🕯️</button>
      <button id="manualButton">خاموش کردن شمع‌ها با لمس</button>

      <div id="status">برای شروع روی دکمه بزن.</div>

      <section id="message">
        <h2>تولدت مبارک! 🎂✨</h2>
        <p id="typedMessage"></p>
        <p class="signature">با کلی آرزوی خوب و قشنگ 💙</p>
      </section>
    </main>

    <script>
      const birthdayMessage = `
      تولدت مبارک لقمان
      امیدوارم سال جدید اول از همه سالم و سلامت باشی و از اون مهم تر
      حال دلت همیشه خوب باشه.
      امیدوارم به هر چیزی که آرزوشو داری برسی و به همشون برسی. 🌟
    `;

      const startButton = document.getElementById("startButton");
      const manualButton = document.getElementById("manualButton");
      const statusText = document.getElementById("status");
      const messageBox = document.getElementById("message");
      const typedMessage = document.getElementById("typedMessage");

      let audioContext = null;
      let analyser = null;
      let microphone = null;
      let stream = null;
      let celebrating = false;
      let loudSamples = 0;

      const BLOW_THRESHOLD = 0.13;

      startButton.addEventListener("click", startBirthday);
      manualButton.addEventListener("click", celebrate);

      async function startBirthday() {
        startButton.disabled = true;
        startButton.textContent = "در حال آماده‌سازی...";

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("Microphone is not supported");
          }

          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: false,
            },
          });

          audioContext = new (
            window.AudioContext || window.webkitAudioContext
          )();

          analyser = audioContext.createAnalyser();
          analyser.fftSize = 1024;
          analyser.smoothingTimeConstant = 0.35;

          microphone = audioContext.createMediaStreamSource(stream);
          microphone.connect(analyser);

          startButton.style.display = "none";
          manualButton.style.display = "inline-block";

          statusText.textContent = "حالا نزدیک میکروفون گوشی فوت کن 💨";

          detectBlow();
        } catch (error) {
          console.error(error);
          startButton.style.display = "none";
          manualButton.style.display = "inline-block";
          statusText.textContent =
            "میکروفون فعال نشد؛ از دکمهٔ جایگزین استفاده کن.";
        }
      }

      function detectBlow() {
        if (celebrating || !analyser) return;

        const data = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(data);

        let sum = 0;
        for (let i = 0; i < data.length; i++) {
          const value = (data[i] - 128) / 128;
          sum += value * value;
        }

        const volume = Math.sqrt(sum / data.length);

        if (volume > BLOW_THRESHOLD) {
          loudSamples++;
        } else {
          loudSamples = 0;
        }

        if (loudSamples >= 3) {
          celebrate();
          return;
        }

        requestAnimationFrame(detectBlow);
      }

      function celebrate() {
        if (celebrating) return;
        celebrating = true;

        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
        if (audioContext && audioContext.state !== "closed") {
          audioContext.close();
        }

        document.querySelectorAll(".flame").forEach((flame) => {
          flame.style.display = "none";
        });

        manualButton.style.display = "none";
        statusText.textContent = "شمع‌ها خاموش شدند! 🎉💙";

        createConfetti();
        createSparkles();

        setTimeout(() => {
          messageBox.style.display = "block";
          typeMessage(birthdayMessage);
        }, 700);
      }

      function typeMessage(text) {
        let index = 0;
        typedMessage.innerHTML = "";

        function writeCharacter() {
          if (index >= text.length) return;
          const character = text[index];
          typedMessage.innerHTML += character === "\n" ? "<br>" : character;
          index++;
          setTimeout(writeCharacter, 35);
        }

        writeCharacter();
      }

      function createConfetti() {
        const colors = [
          "#00e5ff",
          "#29b6f6",
          "#ffd166",
          "#ff4081",
          "#00e676",
          "#ffffff",
        ];

        for (let i = 0; i < 130; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = Math.random() * 100 + "vw";
          piece.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
          piece.style.animationDuration = 2.5 + Math.random() * 3 + "s";
          piece.style.animationDelay = Math.random() * 0.8 + "s";
          piece.style.setProperty("--move-x", Math.random() * 300 - 150 + "px");

          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 6000);
        }
      }

      function createSparkles() {
        const symbols = ["✨", "⭐", "💫", "🎉", "💙"];

        for (let i = 0; i < 20; i++) {
          const sparkle = document.createElement("div");
          sparkle.className = "sparkle";
          sparkle.textContent =
            symbols[Math.floor(Math.random() * symbols.length)];
          sparkle.style.left = Math.random() * 100 + "vw";
          sparkle.style.top = 45 + Math.random() * 30 + "vh";
          sparkle.style.animationDelay = Math.random() * 0.7 + "s";

          document.body.appendChild(sparkle);
          setTimeout(() => sparkle.remove(), 2500);
        }
      }
    </script>
  </body>
</html>
